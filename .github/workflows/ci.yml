name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run python .github/scripts/verify_dist.py
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an offline fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/updater-fixture"
          printf 'FROM scratch\n' > "$RUNNER_TEMP/updater-fixture/Dockerfile"
      - uses: ./
        id: update
        with:
          directory: ${{ runner.temp }}/updater-fixture
          ecosystems: docker
          dry-run: 'true'
      - name: Check Action outputs
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          REPORT: ${{ steps.update.outputs.report-path }}
        run: |
          test "$CHANGED" = false
          test -f "$REPORT"
